<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake – Minispill</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container narrow">
    <a class="back" href="../../index.html">← Alle spill</a>

    <div class="game-header">
      <div>
        <h1>Snake</h1>
        <p id="speed" class="mode">Fart 1</p>
      </div>
      <div class="scores">
        <div class="score"><span>Epler</span><strong id="score">0</strong></div>
        <div class="score"><span>Rekord</span><strong id="best">–</strong></div>
      </div>
    </div>

    <div id="board" class="board board-snake">
      <canvas id="canvas" aria-label="Brett, 15 × 15 ruter"></canvas>
    </div>

    <p id="message" class="message"></p>

    <div class="controls">
      <button id="pause" class="btn">Pause</button>
      <button id="new" class="btn primary">Nytt spill</button>
    </div>

    <p class="help">
      Piltaster eller WASD · sveip på brettet · mellomrom pauser.
      <a href="REGLER.md">Regler</a>
    </p>
  </main>

  <script src="../../shared/common.js"></script>
  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
