<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breakout – Minispill</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container narrow">
    <a class="back" href="../../index.html">← Alle spill</a>

    <div class="game-header">
      <h1>Breakout</h1>
      <div class="stats">
        <div><span>Poeng</span> <strong id="score">0</strong></div>
        <div><span>Liv</span> <strong id="lives">3</strong></div>
        <div><span>Brett</span> <strong id="level">1</strong></div>
        <div><span>Rekord</span> <strong id="best">–</strong></div>
      </div>
    </div>

    <div id="board" class="board bboard">
      <canvas id="canvas" aria-label="Spillflate: klosser øverst, racket nederst"></canvas>
    </div>

    <p id="message" class="message" aria-live="polite"></p>

    <div class="controls">
      <button id="pause" class="btn">Pause</button>
      <button id="new" class="btn primary">Nytt spill</button>
    </div>

    <p class="help">
      ← / → eller A / D flytter racketen, mellomrom sender ballen. På touch drar du med fingeren og trykker for å sende ballen.
      <a href="REGLER.md">Regler</a>
    </p>
  </main>

  <script src="../../shared/common.js"></script>
  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
