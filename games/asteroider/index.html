<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asteroider – Minispill</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container narrow">
    <a class="back" href="../../index.html">← Alle spill</a>

    <div class="game-header">
      <h1>Asteroider</h1>
      <div class="stats">
        <div><span>Poeng</span> <strong id="score">0</strong></div>
        <div><span>Liv</span> <strong id="lives" class="lives">♥♥♥</strong></div>
        <div><span>Rekord</span> <strong id="best">–</strong></div>
      </div>
    </div>

    <div id="board" class="board astboard">
      <canvas id="canvas" class="space" aria-label="Rommet med skipet i midten" role="img"></canvas>
    </div>

    <p id="message" class="message" aria-live="polite"></p>

    <div class="controls">
      <button id="new" class="btn primary">Nytt spill</button>
    </div>

    <p class="help">
      ← → eller A D snur, mellomrom skyter. Trykk eller hold på brettet for å sikte og skyte.
      <a href="REGLER.md">Regler</a>
    </p>
  </main>

  <script src="../../shared/common.js"></script>
  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
