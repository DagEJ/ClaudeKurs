<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klikk-sprint – Minispill</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <a class="back" href="../../index.html">← Alle spill</a>

    <div class="game-header">
      <h1>Klikk-sprint</h1>
      <div class="stats">
        <div><span>Tid</span> <strong id="time">10</strong></div>
        <div><span>Klikk</span> <strong id="score">0</strong></div>
        <div><span>Rekord</span> <strong id="best">–</strong></div>
      </div>
    </div>

    <div class="board">
      <button id="target" class="target" disabled>Klikk!</button>
    </div>

    <p id="message" class="message">Trykk «Start» og klikk så mange ganger du kan på 10 sekunder.</p>

    <div class="controls">
      <button id="start" class="btn primary">Start</button>
    </div>

    <p class="help">Mus, touch eller mellomromstasten.</p>
  </main>

  <script src="../../shared/common.js"></script>
  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
